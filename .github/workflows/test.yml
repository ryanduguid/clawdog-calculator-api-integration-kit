name: test

# Gate 1 builds both examples, validates the pinned schema and tests command
# outcomes against a local fabricated service. Gate 2 checks the example's
# required live capabilities and calculation response; it does not compare
# the entire deployed schema with the pin.

on:
  push:
    branches: [main, master, 'clawdog/**']
  pull_request:
    branches: [main, master]
  schedule:
    # Daily 06:00 UTC against PROD so contract drift surfaces even on idle days.
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  gate-1-hermetic:
    name: Gate 1 — hermetic example regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate OpenAPI snapshot is well-formed JSON
        run: |
          python3 -c "import json; json.load(open('openapi/clawdog-calculator-api.openapi.json')); print('✅ snapshot is valid JSON')"

      - name: Validate OpenAPI snapshot conforms to OpenAPI 3.x
        run: |
          pip install openapi-spec-validator
          openapi-spec-validator openapi/clawdog-calculator-api.openapi.json
          echo "✅ snapshot conforms to OpenAPI 3.x"

      - name: Python example syntax check
        run: |
          python3 -c "import py_compile; py_compile.compile('examples/python/quickstart.py', doraise=True); print('✅ Python example compiles')"

      - name: Gate 2 rounding-policy assertion — syntax check
        run: |
          python3 -c "import py_compile; py_compile.compile('gates/gate2_rounding_policy.py', doraise=True); print('✅ Gate 2 rounding-policy assertion compiles')"

      - name: .NET example — build
        working-directory: examples/dotnet
        run: |
          dotnet build --nologo --verbosity minimal
          echo "✅ .NET example builds"

      - name: Offline Python and .NET command regressions
        run: python3 -m unittest discover -s tests -v

  gate-2-live-substrate:
    name: Gate 2 — live substrate probe
    runs-on: ubuntu-latest
    needs: gate-1-hermetic
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probe live PROD substrate via Python quickstart
        env:
          CLAWDOG_CALC_API_URL: https://fbt-calculator-api-8340695160.australia-southeast1.run.app
          CLAWDOG_CALC_TIMEOUT: '30'
          CLAWDOG_CALC_RETRIES: '5'
        run: |
          set -euo pipefail
          cd examples/python
          # The example handles 5xx with retry-with-jitter internally. If it
          # exits 0, the required discovery and calculation checks passed.
          python3 quickstart.py
          echo "✅ Live-substrate probe succeeded"

      - name: Probe live PROD substrate via raw curl (defence-in-depth)
        run: |
          set -euo pipefail
          BASE="https://fbt-calculator-api-8340695160.australia-southeast1.run.app"
          # Discovery must advertise the calculator and period used by the example.
          curl -fsS --max-time 30 "$BASE/v1/calculators" \
            | python3 examples/python/probe_contract.py discovery

          # A version difference is informational. Equal versions do not prove
          # schema equality or compatibility of every calculator.
          VERSION=$(curl -fsS --max-time 30 "$BASE/openapi.json" | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])")
          PINNED_VERSION=$(python3 -c "import json; print(json.load(open('openapi/clawdog-calculator-api.openapi.json'))['info']['version'])")
          echo "Live API version: $VERSION"
          echo "Pinned API version: $PINNED_VERSION"
          if [ "$VERSION" != "$PINNED_VERSION" ]; then
            echo "Version differs; review the schema before refreshing the pin."
          fi

          # JSON-RPC failures may use HTTP 200. Validate the envelope and the
          # required tool while allowing additional tools.
          curl -fsS --max-time 30 -X POST "$BASE/mcp" \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | python3 examples/python/probe_contract.py mcp

  gate-2-rounding-policy:
    name: Gate 2 — rounding-policy assertion (all 23 URNs)
    runs-on: ubuntu-latest
    needs: gate-1-hermetic
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Assert manifest.rounding_policy on every 200 across all 23 URNs
        env:
          CLAWDOG_CALC_API_URL: https://fbt-calculator-api-8340695160.australia-southeast1.run.app
          CLAWDOG_CALC_TIMEOUT: '30'
          CLAWDOG_CALC_RETRIES: '5'
          # STRICT: a real substrate outage fails this gate rather than green-
          # washing an unverified invariant. The gate still tolerates transient
          # 5xx via retry-with-jitter; only an all-URN outage after retries
          # trips the strict failure.
          CLAWDOG_GATE_STRICT: '1'
        run: |
          set -e
          # Discovers the URN list live, asserts count == 23 (unchanged), and
          # asserts manifest.rounding_policy == "lodgeit-rounding-1.0" on every
          # HTTP 200. Reports 23/23 explicitly. See gates/gate2_rounding_policy.py.
          python3 gates/gate2_rounding_policy.py
          echo "✅ Gate 2 rounding-policy invariant held; URN counts unchanged 23/23"
